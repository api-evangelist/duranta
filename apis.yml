name: Duranta
description: 'Duranta Labs is an applied AI laboratory building geospatial and computer-vision
  technology to understand the physical world. Its foundation vision model, Aidan, generates
  accurate, current 4D digital twins from optical imagery. That model powers a Landscapers
  solution that lets professionals measure, design, and bid any property directly from
  imagery without a site visit, a general-purpose World Model for spatial intelligence,
  and a forthcoming AEC (architecture, engineering, and construction) product that turns
  an address into a precise digital model. Duranta is backed by Fifth Wall.'
